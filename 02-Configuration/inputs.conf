# Splunk Universal Forwarder - inputs.conf
# This file tells Splunk UF which logs to collect from Windows 10

# Windows Security Event Log (includes Event ID 4624, 4625, 4688)
[WinEventLog://Security]
disabled = 0
index = windows

# Windows System Event Log
[WinEventLog://System]
disabled = 0
index = windows

# Windows Application Event Log
[WinEventLog://Application]
disabled = 0
index = windows

# Sysmon Operational Log (Process Creation, Network Connection, etc.)
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
sourcetype = XmlWinEventLog
